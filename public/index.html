<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Landing Page</title>
    <style>
      body { margin: 0; font-family: Arial, sans-serif; background: #f7f9fc; color: #0d1b2a; display: grid; place-items: center; min-height: 100vh; text-align: center; }
      .container { width: min(90%, 720px); background: white; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); padding: 2rem; }
      h1 { margin-top: 0; color: #1a365d; }
      p { color: #334e6b; line-height: 1.55; }
      .cta { margin-top: 1.2rem; display: inline-block; background: #1d4ed8; color: white; text-decoration: none; padding: 0.65rem 1.2rem; border-radius: 8px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Welcome to your Node landing page</h1>
      <p>This is a simple Express app serving a static landing page. You can customize this page and add more routes in <code>index.js</code>.</p>
      <a class="cta" href="#">Get Started</a>
    </div>
  </body>
</html>
